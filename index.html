<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="styless.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <header>
      <h1>My Library</h1>
      <form action="" onsubmit="addBookToLibrary(event)">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" name="title" id="title" required />
        </div>
        <div class="form-group">
          <label for="author">Author</label>
          <input type="text" name="author" id="author" required />
        </div>
        <div class="form-group">
          <label for="pages">Pages</label>
          <input type="number" name="pages" id="pages" required />
        </div>
        <div class="read-box">
          <label for="read">Read it?</label>
          <input type="checkbox" name="read" id="read" />
        </div>
        <button class="add-btn" type="submit">Add Book</button>
      </form>
    </header>
    <main>
      <div class="card">
        <div>
          <p class="mark true">Readed</p>
          <h2>The End of the World Volume 1</h2>
          <p>Acumalaka</p>
          <p>144 pages</p>
        </div>
        <div>
          <button class="remove-btn">remove</button>
        </div>
      </div>
      <div class="card">
        <div>
          <p class="mark false">Unreaded</p>
          <h2>The End of the World Volume 2</h2>
          <p>Acumalaka</p>
          <p>384 pages</p>
        </div>
        <div>
          <button class="remove-btn">remove</button>
        </div>
      </div>
    </main>
  </body>
</html>
